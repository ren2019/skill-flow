name: Desktop Active Detail Freshness Gate

on:
  push:
    branches:
      - ci/desktop-active-detail-freshness-gate

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop-mac
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Targeted desktop selection tests
        run: swift test --filter MainViewModelSelectionTests
      - name: Full Swift package suite
        run: swift test
