name: test-cross-platform

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  desktop-cross-platform:
    name: desktop integration and smoke tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop cross-platform tests
        run: npm run desktop:test:cross-platform
